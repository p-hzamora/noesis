name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands, ideally from `make sandbox`.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `noesis doctor --json`
      render: json
      description: Remove secrets and private paths first.
  - type: input
    id: version
    attributes:
      label: Version and OS
      placeholder: "noesis 0.1.0, Python 3.14, Arch Linux"
    validations:
      required: true
